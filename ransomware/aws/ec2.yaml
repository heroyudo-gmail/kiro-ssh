AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Ransomware cloud-backup experiment - Instans EC2.
  EC2 di subnet PUBLIK (dapat public IP, akses internet via IGW - tanpa NAT).
  Dilengkapi 1 volume EBS tambahan sebagai "air-gapped storage" yang di-mount
  hanya saat backup/restore. Root volume menyimpan OS + kode + dataset primer.
  Mengimpor output dari stack vpc.yaml (ProjectName harus sama).

Parameters:
  ProjectName:
    Type: String
    Default: rw-backup
    Description: Harus sama dengan ProjectName pada stack vpc.yaml.
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.medium, t3.large, t3.xlarge]
    Description: Tipe instans (t3.large = 2 vCPU, 8 GB - cukup untuk Opsi Cepat).
  RootVolumeSizeGb:
    Type: Number
    Default: 30
    Description: Ukuran root volume (OS + kode + dataset primer).
  AirgapVolumeSizeGb:
    Type: Number
    Default: 20
    Description: Ukuran EBS air-gapped storage (Opsi Cepat = 20 GB cukup).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: AMI Ubuntu 22.04 terbaru (via SSM public parameter).

Resources:
  # Akses instans via AWS Systems Manager (SSM) Session Manager - TANPA key pair,
  # TANPA port SSH terbuka. Meniru pola project NIDS (lebih aman & praktis).
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: '*'

  EC2Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EC2Role]

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG untuk instans eksperimen ransomware backup (egress saja; akses via SSM)
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-VpcId'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Semua egress (pip/apt/S3/SSM)
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-sg'

  BackupInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref EC2Profile
      SubnetId:
        Fn::ImportValue: !Sub '${ProjectName}-PublicSubnetId'
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGb
            VolumeType: gp3
            DeleteOnTermination: true
        # Volume air-gapped. DeleteOnTermination=false agar cadangan tak hilang
        # bila instans di-terminate secara tidak sengaja.
        - DeviceName: /dev/sdf
          Ebs:
            VolumeSize: !Ref AirgapVolumeSizeGb
            VolumeType: gp3
            DeleteOnTermination: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          apt-get update -y
          apt-get install -y python3-pip python3-venv git awscli libsnappy-dev
          # Library kompresi & kripto untuk sistem backup.
          # --break-system-packages: Ubuntu 22.04+ menandai environment 'externally-managed'.
          pip3 install --no-cache-dir --break-system-packages zstandard brotli lz4 python-snappy pycryptodome openpyxl pillow numpy pandas || true
          # Format & siapkan mount point air-gapped (tidak auto-mount permanen;
          # sistem akan mount/unmount sendiri saat backup/restore).
          mkdir -p /mnt/airgap
          echo "Setup selesai. Volume air-gapped di /dev/nvme1n1 atau /dev/xvdf (cek lsblk)." > /home/ubuntu/SETUP_DONE.txt
          chown ubuntu:ubuntu /home/ubuntu/SETUP_DONE.txt
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-instance'

Outputs:
  InstanceId:
    Description: ID instans EC2
    Value: !Ref BackupInstance
  PublicIp:
    Description: Public IP instans (informasi; akses tetap via SSM)
    Value: !GetAtt BackupInstance.PublicIp
  SsmCommand:
    Description: Perintah membuka sesi via SSM Session Manager (tanpa key pair)
    Value: !Sub 'aws ssm start-session --target ${BackupInstance}'
  AirgapDeviceHint:
    Description: Perangkat EBS air-gapped (cek dengan lsblk; biasanya /dev/nvme1n1 pada Nitro)
    Value: /dev/sdf
