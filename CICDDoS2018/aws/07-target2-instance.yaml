AWSTemplateFormatVersion: '2010-09-09'
Description: Target-2 (Open-Source IDS) - Amazon Linux 2023, same VPC as Target-1

Parameters:
  ProjectName:
    Type: String
    Default: testing-multidetection

  InstanceAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-target2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:*
                Resource: '*'

  EC2Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EC2Role]

  Target2Node:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.large
      ImageId: !Ref InstanceAmiId
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-subnet-id
      SecurityGroupIds:
        - Fn::ImportValue: !Sub ${ProjectName}-sg-id
      IamInstanceProfile: !Ref EC2Profile
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-target2

Outputs:
  Target2InstanceId:
    Value: !Ref Target2Node
  Target2PublicIp:
    Value: !GetAtt Target2Node.PublicIp
  Target2PrivateIp:
    Value: !GetAtt Target2Node.PrivateIp
