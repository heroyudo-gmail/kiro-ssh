AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IDS2018 Testing - Step 4: Open-Source IDS/IPS Target (Target-3)
  EC2 + Suricata (L3/L4/L7 IDS/IPS) + Fail2Ban (brute-force) + ModSecurity (WAF L7)
  Tujuan: Bandingkan detection rate ML vs AWS Services vs Open-Source IDS

Parameters:
  ProjectName:
    Type: String
    Default: ids2018-test

  InstanceAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  TargetInstanceType:
    Type: String
    Default: t3.medium
    Description: Medium karena Suricata butuh RAM untuk rule processing

Resources:
  # ============================================================
  # TARGET-3: Open-Source IDS/IPS Protected
  # Tools: Suricata (IDS/IPS L3-L7), Fail2Ban (brute-force), ModSecurity (WAF)
  # ============================================================
  OpenSourceTarget:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref TargetInstanceType
      ImageId: !Ref InstanceAmiId
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-private-subnet-id
      SecurityGroupIds:
        - Fn::ImportValue: !Sub ${ProjectName}-instance-sg-id
      IamInstanceProfile: !Sub ${ProjectName}-ssm-profile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          yum update -y

          # ========== TARGET SERVICES (sama seperti Target-1 & Target-2) ==========
          # SSH
          useradd -m testuser && echo "testuser:P@ssw0rd123" | chpasswd
          sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          systemctl restart sshd

          # HTTP (Nginx + ModSecurity)
          yum install -y nginx
          systemctl enable nginx && systemctl start nginx

          # FTP
          yum install -y vsftpd
          echo "local_enable=YES" >> /etc/vsftpd/vsftpd.conf
          systemctl enable vsftpd && systemctl start vsftpd

          # ========== SURICATA (IDS/IPS — Layer 3, 4, 7) ==========
          # Suricata = network-based IDS/IPS, inspects packets at all layers
          yum install -y suricata

          # Download & update rulesets (ET Open Rules)
          suricata-update

          # Configure Suricata in IPS mode (inline, can drop packets)
          cat > /etc/suricata/suricata-ids2018.yaml << 'SURICONF'
          %YAML 1.1
          ---
          vars:
            address-groups:
              HOME_NET: "[10.1.0.0/16]"
              EXTERNAL_NET: "!$HOME_NET"
            port-groups:
              HTTP_PORTS: "80"
              SSH_PORTS: "22"

          default-log-dir: /var/log/suricata/
          outputs:
            - eve-log:
                enabled: yes
                filetype: regular
                filename: eve.json
                types:
                  - alert
                  - flow
                  - stats

          af-packet:
            - interface: eth0
              cluster-id: 99
              cluster-type: cluster_flow
              defrag: yes

          app-layer:
            protocols:
              http:
                enabled: yes
              ssh:
                enabled: yes
              ftp:
                enabled: yes
          SURICONF

          # Custom rules for IDS2018 attack types
          mkdir -p /var/lib/suricata/rules/custom
          cat > /var/lib/suricata/rules/custom/ids2018.rules << 'RULES'
          # SSH Brute-Force detection (threshold: >5 attempts in 60s)
          alert ssh any any -> $HOME_NET $SSH_PORTS (msg:"IDS2018 SSH Brute-Force Detected"; flow:to_server,established; threshold:type both, track by_src, count 5, seconds 60; sid:2018001; rev:1;)

          # FTP Brute-Force detection
          alert ftp any any -> $HOME_NET 21 (msg:"IDS2018 FTP Brute-Force Detected"; flow:to_server,established; content:"USER"; threshold:type both, track by_src, count 5, seconds 60; sid:2018002; rev:1;)

          # HTTP Slowloris detection (incomplete HTTP requests)
          alert http any any -> $HOME_NET $HTTP_PORTS (msg:"IDS2018 Slowloris DoS Detected"; flow:to_server,established; flowbits:isnotset,http.body; threshold:type both, track by_src, count 20, seconds 30; sid:2018003; rev:1;)

          # HTTP Flood detection (high request rate)
          alert http any any -> $HOME_NET $HTTP_PORTS (msg:"IDS2018 HTTP Flood (Hulk/GoldenEye) Detected"; flow:to_server,established; threshold:type both, track by_src, count 100, seconds 10; sid:2018004; rev:1;)

          # SYN Flood detection
          alert tcp any any -> $HOME_NET any (msg:"IDS2018 SYN Flood Detected"; flags:S; threshold:type both, track by_src, count 500, seconds 10; sid:2018005; rev:1;)

          # UDP Flood detection
          alert udp any any -> $HOME_NET any (msg:"IDS2018 UDP Flood Detected"; threshold:type both, track by_src, count 1000, seconds 10; sid:2018006; rev:1;)

          # SlowHTTPTest detection (slow POST body)
          alert http any any -> $HOME_NET $HTTP_PORTS (msg:"IDS2018 Slow HTTP POST Detected"; flow:to_server,established; content:"POST"; http_method; flowbits:isnotset,http.body.complete; threshold:type both, track by_src, count 10, seconds 30; sid:2018007; rev:1;)
          RULES

          # Enable custom rules
          echo "rule-files:" >> /etc/suricata/suricata-ids2018.yaml
          echo "  - /var/lib/suricata/rules/suricata.rules" >> /etc/suricata/suricata-ids2018.yaml
          echo "  - /var/lib/suricata/rules/custom/ids2018.rules" >> /etc/suricata/suricata-ids2018.yaml

          # Start Suricata
          systemctl enable suricata
          suricata -c /etc/suricata/suricata-ids2018.yaml -i eth0 -D
          echo "Suricata started in IDS mode"

          # ========== FAIL2BAN (Brute-Force Prevention — SSH, FTP) ==========
          yum install -y fail2ban

          cat > /etc/fail2ban/jail.local << 'F2BCONF'
          [DEFAULT]
          bantime = 600
          findtime = 300
          maxretry = 5
          banaction = iptables-multiport
          backend = systemd

          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          maxretry = 5
          findtime = 300
          bantime = 600
          logpath = /var/log/secure

          [vsftpd]
          enabled = true
          port = ftp
          filter = vsftpd
          maxretry = 5
          findtime = 300
          bantime = 600
          logpath = /var/log/vsftpd.log
          F2BCONF

          systemctl enable fail2ban && systemctl start fail2ban
          echo "Fail2Ban started"

          # ========== MODSECURITY (WAF — Layer 7 HTTP) ==========
          # Install ModSecurity with Nginx connector
          yum install -y gcc-c++ flex bison yajl-devel curl-devel GeoIP-devel pcre-devel libxml2-devel lmdb-devel
          yum install -y libmodsecurity 2>/dev/null || true

          # Jika libmodsecurity tidak tersedia via yum, install via nginx module
          # Untuk simplicity, gunakan Nginx rate limiting sebagai alternatif L7 protection
          cat > /etc/nginx/conf.d/rate_limit.conf << 'NGXRL'
          # Rate limiting: 10 req/s per IP (burst 20)
          limit_req_zone $binary_remote_addr zone=ids2018:10m rate=10r/s;

          server {
              listen 80 default_server;
              location / {
                  limit_req zone=ids2018 burst=20 nodelay;
                  root /usr/share/nginx/html;
                  index index.html;
              }
          }
          NGXRL

          nginx -t && systemctl reload nginx
          echo "Nginx rate limiting configured"

          # ========== LOGGING: Consolidated alert log ==========
          mkdir -p /opt/ids2018/logs
          cat > /opt/ids2018/collect_alerts.sh << 'SCRIPT'
          #!/bin/bash
          # Collect alerts from all IDS tools into one CSV
          OUTPUT="/opt/ids2018/logs/alerts_$(date +%Y%m%d_%H%M%S).csv"
          echo "timestamp,source,alert_type,src_ip,details" > "$OUTPUT"

          # Suricata alerts
          if [ -f /var/log/suricata/eve.json ]; then
            cat /var/log/suricata/eve.json | python3 -c "
          import json, sys
          for line in sys.stdin:
              try:
                  e = json.loads(line)
                  if e.get('event_type') == 'alert':
                      ts = e.get('timestamp','')
                      src = e.get('src_ip','')
                      msg = e.get('alert',{}).get('signature','')
                      print(f'{ts},suricata,{msg},{src},')
              except: pass
          " >> "$OUTPUT"
          fi

          # Fail2Ban bans
          fail2ban-client status sshd 2>/dev/null | grep "Banned IP" | while read line; do
            echo "$(date -Iseconds),fail2ban,SSH-Ban,$line," >> "$OUTPUT"
          done

          # Nginx rate limit rejects (from error log)
          grep "limiting requests" /var/log/nginx/error.log 2>/dev/null | tail -100 | while read line; do
            echo "$(date -Iseconds),nginx,RateLimit,,${line}" >> "$OUTPUT"
          done

          echo "Alerts collected: $OUTPUT"
          wc -l "$OUTPUT"
          SCRIPT
          chmod +x /opt/ids2018/collect_alerts.sh

          echo "Target-3 (Open-Source IDS) setup complete" > /tmp/setup.log
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-target3-opensource
        - Key: Role
          Value: target-opensource

Outputs:
  OpenSourceTargetId:
    Value: !Ref OpenSourceTarget
    Export:
      Name: !Sub ${ProjectName}-target3-id
  OpenSourceTargetIp:
    Value: !GetAtt OpenSourceTarget.PrivateIp
    Export:
      Name: !Sub ${ProjectName}-target3-ip
